let currentLang = 'en';

function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;

    document.querySelectorAll('[data-t]').forEach(el => {
        const key = el.getAttribute('data-t');
        if (translations[lang][key]) {
            el.innerHTML = translations[lang][key];
        }
    });

    const btnEn = document.getElementById('lang-en');
    const btnPl = document.getElementById('lang-pl');

    if (lang === 'en') {
        btnEn.classList.add('text-blue-600', 'bg-blue-50');
        btnEn.classList.remove('text-slate-400', 'hover:text-slate-600');
        btnPl.classList.remove('text-blue-600', 'bg-blue-50');
        btnPl.classList.add('text-slate-400', 'hover:text-slate-600');
    } else {
        btnPl.classList.add('text-blue-600', 'bg-blue-50');
        btnPl.classList.remove('text-slate-400', 'hover:text-slate-600');
        btnEn.classList.remove('text-blue-600', 'bg-blue-50');
        btnEn.classList.add('text-slate-400', 'hover:text-slate-600');
    }
}

function revealEmail(button) {
    const emailSpan = button.querySelector('.email-text');
    if (!emailSpan) return;

    const email = 'contact' + '@' + 'halaczkiewicz.it';
    const suffix = translations[currentLang].copied || ' (Copied!)';

    emailSpan.textContent = email;

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(email).then(() => {
            const originalText = email;
            emailSpan.textContent = email + suffix;
            setTimeout(() => {
                emailSpan.textContent = originalText;
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    } else {
        const textArea = document.createElement("textarea");
        textArea.value = email;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            const originalText = email;
            emailSpan.textContent = email + suffix;
            setTimeout(() => {
                emailSpan.textContent = originalText;
            }, 2000);
        } catch (err) {
            console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
    }
}

window.addEventListener('DOMContentLoaded', () => setLanguage('en'));

<script>
document.querySelectorAll('a[href]').forEach(a => {
  a.addEventListener('mouseover', () => {
    const url = a.href;
    if (!url.startsWith(location.origin)) return;
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    document.head.appendChild(link);
  });
});
</script>
