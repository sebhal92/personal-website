<!-- Styles -->
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; scroll-behavior: smooth; }
    .timeline-line { position: absolute; left: 50%; width: 2px; height: 100%; background-color: #e2e8f0; transform: translateX(-50%); }
    .timeline-dot { position: absolute; left: 50%; width: 12px; height: 12px; background-color: #3b82f6; border: 2px solid #fff; border-radius: 50%; transform: translateX(-50%); z-index: 10; }
    .expertise-card { transition: transform 0.2s; }
    .expertise-card:hover { transform: translateY(-4px); }
    @media (max-width: 768px) {
        .timeline-line { left: 24px; }
        .timeline-dot { left: 24px; }
    }

    /* Skills Matrix – mobile optimization */
    @media (max-width: 640px) {
        #skills table th,
        #skills table td {
            padding-left: 0.75rem;
            padding-right: 0.75rem;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        #skills table {
            width: 100%;
            table-layout: fixed;
        }

        #skills th:nth-child(1),
        #skills td:nth-child(1) {
            width: 40%;
        }

        #skills th:nth-child(2),
        #skills td:nth-child(2) {
            width: 30%;
        }

        #skills th:nth-child(3),
        #skills td:nth-child(3) {
            width: 30%;
        }
    }
</style>
