<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Delikatny biały grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="1"/>
    </pattern>

    <!-- Cień pod kartą -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="rgba(15,23,42,0.18)"/>
    </filter>
  </defs>

  <!-- Tło: białe + delikatny grid -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Centralna karta -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="110" width="900" height="410" rx="32" fill="#ffffff"/>
  </g>

  <!-- Lewa część karty -->
  <g transform="translate(200, 170)">
    <!-- Label -->
    <rect x="0" y="-26" width="260" height="24" rx="999" fill="rgba(37,99,235,0.08)"/>
    <text x="20" y="-9"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12"
          fill="#2563eb"
          letter-spacing="0.18em">
      PLATFORM OPERATIONS
    </text>

    <!-- Tytuł -->
    <text x="0" y="40"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="38"
          font-weight="700"
          fill="#0f172a">
      Platform Operations Engineer
    </text>

    <!-- Imię i nazwisko -->
    <text x="0" y="86"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24"
          font-weight="600"
          fill="#1f2937">
      Sebastian Hałaczkiewicz
    </text>

    <!-- Podtytuł -->
    <text x="0" y="122"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15"
          fill="#4b5563">
      Azure • Datadog • Windows Server • Active Directory • VMware • Cloud Operations
    </text>
  </g>

  <!-- Prawa część karty -->
  <g transform="translate(720, 180)">
    <!-- Nagłówek sekcji -->
    <text x="0" y="0"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12"
          fill="#6b7280"
          letter-spacing="0.18em">
      CORE STACK
    </text>

    <!-- Pigułki technologii -->
    <g transform="translate(0, 24)">
      <!-- Azure -->
      <rect x="0" y="0" width="150" height="32" rx="999"
            fill="#f9fafb" stroke="#2563eb" stroke-width="1"/>
      <circle cx="18" cy="16" r="6" fill="#2563eb"/>
      <text x="34" y="21"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#111827">
        Azure
      </text>

      <!-- Datadog -->
      <rect x="170" y="0" width="150" height="32" rx="999"
            fill="#f9fafb" stroke="#7c3aed" stroke-width="1"/>
      <circle cx="188" cy="16" r="6" fill="#7c3aed"/>
      <text x="204" y="21"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#111827">
        Datadog
      </text>

      <!-- Windows Server -->
      <rect x="0" y="44" width="190" height="32" rx="999"
            fill="#f9fafb" stroke="#0ea5e9" stroke-width="1"/>
      <rect x="14" y="52" width="12" height="12" fill="#38bdf8"/>
      <rect x="30" y="52" width="12" height="12" fill="#0ea5e9"/>
      <text x="50" y="71"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#111827">
        Windows Server
      </text>

      <!-- VMware -->
      <rect x="210" y="44" width="150" height="32" rx="999"
            fill="#f9fafb" stroke="#22c55e" stroke-width="1"/>
      <rect x="224" y="52" width="10" height="10" fill="#22c55e"/>
      <rect x="236" y="56" width="10" height="10" fill="#4ade80"/>
      <text x="252" y="71"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#111827">
        VMware
      </text>
    </g>

    <!-- CTA -->
    <g transform="translate(0, 132)">
      <!-- Przycisk -->
      <rect x="0" y="0" width="230" height="46" rx="999" fill="#2563eb"/>
      <text x="26" y="29"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17"
            font-weight="600"
            fill="#ffffff">
        LET’S CONNECT →
      </text>

      <!-- URL -->
      <text x="4" y="74"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#6b7280">
        halaczkiewicz.it
      </text>
    </g>
  </g>

  <!-- Mały badge „AVAILABLE” w prawym górnym rogu karty -->
  <g transform="translate(930, 130)">
    <rect x="0" y="0" width="110" height="26" rx="999"
          fill="#ecfdf3" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="18" cy="13" r="5" fill="#22c55e"/>
    <text x="30" y="17"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12"
          fill="#166534">
      AVAILABLE
    </text>
  </g>
</svg>
