<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Delikatny grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="1"/>
    </pattern>

    <!-- Cień karty -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="rgba(15,23,42,0.16)"/>
    </filter>
  </defs>

  <!-- Tło -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.45"/>

  <!-- Centralna karta -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="110" width="900" height="410" rx="24" fill="#ffffff"/>
  </g>

  <!-- Lewa część karty -->
  <g transform="translate(200, 175)">
    <!-- Label -->
    <rect x="0" y="-26" width="260" height="24" rx="999"
          fill="rgba(37,99,235,0.06)" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="-9"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12"
          fill="#2563eb"
          letter-spacing="0.18em">
      PLATFORM OPERATIONS
    </text>

    <!-- Tytuł -->
    <text x="0" y="40"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="36"
          font-weight="700"
          fill="#0f172a">
      Platform Operations Engineer
    </text>

    <!-- Imię i nazwisko -->
    <text x="0" y="82"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24"
          font-weight="600"
          fill="#1f2937">
      Sebastian Hałaczkiewicz
    </text>

    <!-- Podtytuł -->
    <text x="0" y="118"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15"
          fill="#4b5563">
      Azure • Datadog • Windows Server • Active Directory • VMware • Cloud Operations
    </text>
  </g>

  <!-- Prawa część karty -->
  <g transform="translate(720, 185)">
    <!-- Nagłówek sekcji -->
    <text x="0" y="0"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12"
          fill="#6b7280"
          letter-spacing="0.18em">
      CORE STACK
    </text>

    <!-- Pigułki technologii: prostokąty z cienką ramką, rounded-lg -->
    <g transform="translate(0, 24)">
      <!-- Azure -->
      <rect x="0" y="0" width="190" height="32" rx="8"
            fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
      <text x="16" y="21"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#111827">
        Azure
      </text>

      <!-- Datadog -->
      <rect x="0" y="44" width="190" height="32" rx="8"
            fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
      <text x="16" y="65"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#111827">
        Datadog
      </text>

      <!-- Windows Server -->
      <rect x="0" y="88" width="190" height="32" rx="8"
            fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
      <text x="16" y="109"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#111827">
        Windows Server
      </text>

      <!-- VMware -->
      <rect x="0" y="132" width="190" height="32" rx="8"
            fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
      <text x="16" y="153"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#111827">
        VMware
      </text>
    </g>

    <!-- CTA -->
    <g transform="translate(0, 190)">
      <!-- Przycisk -->
      <rect x="0" y="0" width="230" height="46" rx="999" fill="#2563eb"/>
      <text x="26" y="29"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17"
            font-weight="600"
            fill="#ffffff">
        LET’S CONNECT →
      </text>

      <!-- URL -->
      <text x="4" y="74"
            font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14"
            fill="#6b7280">
        halaczkiewicz.it
      </text>
    </g>
  </g>

  <!-- Badge AVAILABLE -->
  <g transform="translate(930, 135)">
    <rect x="0" y="0" width="110" height="26" rx="999"
          fill="#ecfdf3" stroke="#bbf7d0" stroke-width="1"/>
    <text x="20" y="17"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12"
          fill="#166534">
      AVAILABLE
    </text>
  </g>
</svg>
