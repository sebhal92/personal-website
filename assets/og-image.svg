<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient tła -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>

    <!-- Cień karty -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
  </defs>

  <!-- Tło -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.35"/>

  <!-- Karta -->
  <g filter="url(#shadow)">
    <rect x="120" y="90" width="960" height="450" rx="32" fill="#0f172a" opacity="0.96"/>
  </g>

  <!-- Lewa kolumna -->
  <g transform="translate(170, 160)">
    <!-- Label -->
    <rect x="0" y="-28" width="300" height="26" rx="999" fill="rgba(37,99,235,0.2)"/>
    <text x="20" y="-10" font-family="Inter, sans-serif" font-size="13" fill="#bfdbfe" letter-spacing="0.18em">
      PLATFORM OPERATIONS
    </text>

    <!-- Tytuł -->
    <text x="0" y="40" font-family="Inter, sans-serif" font-size="42" font-weight="700" fill="#e2e8f0">
      Platform Operations Engineer
    </text>

    <!-- Imię -->
    <text x="0" y="90" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#bfdbfe">
      Sebastian Hałaczkiewicz
    </text>

    <!-- Podtytuł -->
    <text x="0" y="130" font-family="Inter, sans-serif" font-size="17" fill="#94a3b8">
      Azure • Datadog • Windows Server • Active Directory • VMware • Cloud Operations
    </text>
  </g>

  <!-- Prawa kolumna -->
  <g transform="translate(700, 170)">
    <!-- Nagłówek -->
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="0.18em">
      CORE STACK
    </text>

    <!-- Pigułki technologii -->
    <g transform="translate(0, 26)">
      <!-- Azure -->
      <rect x="0" y="0" width="150" height="34" rx="999" fill="rgba(255,255,255,0.05)" stroke="#3b82f6" stroke-width="1"/>
