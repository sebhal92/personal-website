<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Delikatny grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
    </pattern>

    <!-- Cień -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="rgba(15,23,42,0.16)"/>
    </filter>

    <!-- Gradient panelu -->
    <linearGradient id="photoPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0ecff"/>
    </linearGradient>
  </defs>

  <!-- Tło -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.45"/>

  <!-- Karta -->
  <g filter="url(#shadow)">
    <rect x="100" y="80" width="1000" height="470" rx="28" fill="#ffffff"/>
  </g>

  <!-- Panel na zdjęcie -->
  <rect x="100" y="80" width="400" height="470" rx="28" fill="url(#photoPanel)"/>

  <!-- Placeholder ramka -->
  <rect x="140" y="140" width="320" height="390" rx="20"
        fill="none" stroke="rgba(37,99,235,0.25)" stroke-width="3"
        stroke-dasharray="10 10"/>

  <!-- Teksty po prawej -->
  <g transform="translate(540, 150)">
    <!-- Label -->
    <rect x="0" y="-26" width="260" height="24" rx="999"
          fill="rgba(37,99,235,0.06)" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="-9"
          font-family="Inter" font-size="12" fill="#2563eb" letter-spacing="0.18em">
      PLATFORM OPERATIONS
    </text>

    <!-- Tytuł -->
    <text x="0" y="40"
          font-family="Inter" font-size="38" font-weight="700" fill="#0f172a">
      Platform Operations Engineer
    </text>

    <!-- Imię -->
    <text x="0" y="86"
          font-family="Inter" font-size="26" font-weight="600" fill="#1f2937">
      Sebastian Hałaczkiewicz
    </text>

    <!-- Podtytuł -->
    <text x="0" y="122"
          font-family="Inter" font-size="15" fill="#4b5563">
      Azure • Datadog • Windows Server • Active Directory • VMware • Cloud Operations
    </text>

    <!-- CORE STACK -->
    <text x="0" y="170"
          font-family="Inter" font-size="12" fill="#6b7280" letter-spacing="0.18em">
      CORE STACK
    </text>

    <!-- Pigułki -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="190" height="34" rx="8"
            fill="#f9fafb" stroke="#d1d5db"/>
      <text x="16" y="22" font-family="Inter" font-size="14" fill="#111827">Azure</text>

      <rect x="0" y="44" width="190" height="34" rx="8"
            fill="#f9fafb" stroke="#d1d5db"/>
      <text x="16" y="66" font-family="Inter" font-size="14" fill="#111827">Datadog</text>

      <rect x="0" y="88" width="190" height="34" rx="8"
            fill="#f9fafb" stroke="#d1d5db"/>
      <text x="16" y="110" font-family="Inter" font-size="14" fill="#111827">Windows Server</text>

      <rect x="0" y="132" width="190" height="34" rx="8"
            fill="#f9fafb" stroke="#d1d5db"/>
      <text x="16" y="154" font-family="Inter" font-size="14" fill="#111827">VMware</text>
    </g>

    <!-- CTA -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="260" height="50" rx="999" fill="#2563eb"/>
      <text x="26" y="32"
            font-family="Inter" font-size="18" font-weight="600" fill="#ffffff">
        LET’S CONNECT →
      </text>

      <text x="4" y="78"
            font-family="Inter" font-size="14" fill="#6b7280">
        halaczkiewicz.it
      </text>
    </g>
  </g>
</svg>
